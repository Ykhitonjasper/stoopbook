name: StoopBook
options:
  bundleIdPrefix: com.stoopbook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: StoopBook/Info.plist
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.MarioCarmona.StoopBook
    PRODUCT_NAME: StoopBook
    DEVELOPMENT_TEAM: "QPN38WN543"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO
targets:
  StoopBook:
    type: application
    platform: iOS
    sources:
      - path: StoopBook
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
    resources:
      - path: StoopBook/Assets.xcassets
      - path: StoopBook/PrivacyInfo.xcprivacy
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Table MapsGpsAi"
        PRODUCT_BUNDLE_IDENTIFIER: com.MarioCarmona.StoopBook
        PRODUCT_DISPLAY_NAME: "Table MapsGpsAi"
        CODE_SIGN_ENTITLEMENTS: Config/StoopBook.entitlements
        DEVELOPMENT_TEAM: "QPN38WN543"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  StoopBookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StoopBookUITests
    dependencies:
      - target: StoopBook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.MarioCarmona.StoopBook.uitests
        PRODUCT_NAME: StoopBookUITests
        PRODUCT_MODULE_NAME: StoopBookUITests
        DEVELOPMENT_TEAM: "QPN38WN543"
        TEST_TARGET_NAME: StoopBook
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  StoopBook:
    build:
      targets:
        StoopBook: all
        StoopBookUITests: [test]
    test:
      targets:
        - StoopBookUITests
