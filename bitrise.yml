format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

meta:
  bitrise.io:
    stack: osx-xcode-27.0.x
    machine_type_id: g2.mac.large

project_type: ios

app:
  envs:
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: StoopBook.xcodeproj
  - opts:
      is_expand: false
    BITRISE_SCHEME: StoopBook
  - opts:
      is_expand: false
    BUNDLE_ID: com.MarioCarmona.StoopBook
  - opts:
      is_expand: true
    APPLE_API_KEY_ID: "$APPLE_API_KEY_ID"
  - opts:
      is_expand: true
    APPLE_API_ISSUER_ID: "$APPLE_API_ISSUER_ID"
  - opts:
      is_expand: true
    APPLE_API_PRIVATE_KEY: "$APPLE_API_PRIVATE_KEY"
  - opts:
      is_expand: true
    BITRISE_CERTIFICATE_PASSPHRASE: "$BITRISE_CERTIFICATE_PASSPHRASE"

trigger_map:
- push_branch: main
  workflow: app_store
- pull_request_source_branch: "*"
  workflow: app_store

workflows:
  app_store:
    description: XcodeGen → archive → upload IPA to App Store Connect (metadata stays in ASC API).
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - brew-install@1:
        inputs:
        - packages: xcodegen
    - script@1:
        title: Generate Xcode project
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            xcodegen generate
    - script@1:
        title: Prepare App Store Connect API key file
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -eo pipefail
            for v in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
              if [[ -z "${!v:-}" ]]; then
                echo "Missing Bitrise secret: $v (Code Signing → Secrets)"
                exit 1
              fi
            done
            KEY_PATH="$HOME/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
            envman add --key APPLE_API_KEY_PATH --value "$KEY_PATH"
            envman add --key APPLE_API_KEY_URL --value "file://${KEY_PATH}"
    - manage-ios-code-signing@2:
        inputs:
        - apple_service_connection: api-key
        - distribution_method: app-store
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - apple_team_id: "QPN38WN543"
        - api_key_issuer_id: "$APPLE_API_ISSUER_ID"
        - api_key_id: "$APPLE_API_KEY_ID"
        - api_key_path: "$APPLE_API_KEY_PATH"
    - xcode-archive@5:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - distribution_method: app-store
        - automatic_code_signing: "off"
        - export_method: app-store
    - deploy-to-itunesconnect-deliver@2:
        inputs:
        - connection: "off"
        - api_issuer: "$APPLE_API_ISSUER_ID"
        - api_key_path: "$APPLE_API_KEY_URL"
        - ipa_path: "$BITRISE_IPA_PATH"
        - app_id: "6814820010"
        - bundle_id: "$BUNDLE_ID"
        - skip_metadata: "yes"
        - skip_screenshots: "yes"
        - submit_for_review: "no"
        - team_id: "QPN38WN543"
